name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest --cov=xiangqi_tutor --cov-report=term-missing
      - run: python -m mypy src/xiangqi_tutor/board src/xiangqi_tutor/models src/xiangqi_tutor/notation src/xiangqi_tutor/services
